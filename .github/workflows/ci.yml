name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: assert only allowlisted dependencies
        run: |
          allow=github.com/dobbo-ca/raster-go
          bad=$( { go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all 2>/dev/null; awk '{print $1}' go.sum; } | sort -u | grep -vxF "$allow" || true)
          if [ -n "$bad" ]; then
            echo "dependencies outside the allowlist ($allow):"
            echo "$bad"
            exit 1
          fi
